<style>
  :root{
    --bg:#0a0b0f; --panel:#12141b; --panel2:#171a23; --line:#242836;
    --ink:#e8eaf2; --dim:#8b93a7; --accent:#5eead4; --accent2:#a78bfa;
    --warn:#fbbf24; --bad:#f87171; --good:#4ade80;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 15% -10%,#151a2b 0%,var(--bg) 55%);
       color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       padding-bottom:env(safe-area-inset-bottom)}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);
         background:linear-gradient(180deg,#101320,#0c0e15);position:sticky;top:0;z-index:20;
         padding-top:calc(12px + env(safe-area-inset-top))}
  header h1{margin:0;font-size:14px;letter-spacing:.22em;font-weight:700}
  header h1 span{color:var(--accent)}
  header .sub{color:var(--dim);font-size:11.5px}
  header .grow{flex:1}
  .badge{font:10.5px/1 var(--mono);padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--dim);white-space:nowrap}
  .badge.on{color:var(--accent);border-color:#2b5f57;background:#0d2a26}

  @media (min-width:760px){ .badge.hideable{display:inline-block} }
  main{display:grid;grid-template-columns:minmax(380px,1.15fr) minmax(340px,1fr);gap:16px;padding:16px;align-items:start}
  @media (max-width:980px){ main{grid-template-columns:1fr;padding:12px} }
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .panel > h2{margin:0;padding:11px 14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
              border-bottom:1px solid var(--line);background:var(--panel2);display:flex;align-items:center;gap:8px}
  .panel .body{padding:14px}
  .stage{position:relative;background:#000;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
  .stage video,.stage img{width:100%;height:100%;object-fit:cover;display:block}
  .stage .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
                  color:var(--dim);font:12px var(--mono);text-align:center;padding:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row + .row{margin-top:10px}
  label.field{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  select,input[type=text],input[type=password],textarea{background:#0d1017;border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:9px 10px;font:13px/1.4 system-ui,sans-serif;width:100%;outline:none}
  select:focus,input:focus,textarea:focus{border-color:#3b4257}
  textarea{resize:vertical;min-height:64px;font-size:13px}
  button{background:#1b1f2b;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 13px;
         font:600 13px system-ui,sans-serif;cursor:pointer;transition:.15s}
  button:hover:not(:disabled){border-color:#3d4560;background:#222739}
  button:disabled{opacity:.42;cursor:not-allowed}
  button.primary{background:linear-gradient(180deg,#2dd4bf,#0ea5a0);border-color:#0d9488;color:#04211e}

  .switch{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}

  .switch input::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
                       background:#8b93a7;transition:.18s}

  input[type=range]{width:100%;accent-color:var(--accent)}

  .item .slug{font:600 12.5px var(--mono);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .state{font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .item .state.err{color:var(--bad)} .item .state.done{color:var(--good)} .item .state.work{color:var(--warn)}
  .item .meta{font:11px var(--mono);color:var(--dim);margin-top:5px;word-break:break-word}
  .bar{height:4px;background:#1c2130;border-radius:99px;overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.4s}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-height:52vh;overflow:auto}
  .card{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0f121a}
  .card video{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#000}
  .card .cap{padding:7px 8px}
  .card .cap b{display:block;font:600 11px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .cap p{margin:4px 0 0;font-size:10.5px;color:var(--dim);max-height:44px;overflow:hidden}
  .log{font:11px/1.5 var(--mono);color:var(--dim);max-height:140px;overflow:auto;background:#0b0e14;

  .log b{color:var(--ink);font-weight:500}

  .sep{height:1px;background:var(--line);margin:14px 0}

  .banner{background:#0e2320;border:1px solid #1d4b45;border-radius:10px;padding:9px 11px;font-size:11.5px;color:#9fe8dc;margin-bottom:12px}
  @media (pointer:coarse){
    button{padding:14px 16px;font-size:15px}
    .modes{grid-template-columns:repeat(2,1fr)}
    .stage{aspect-ratio:3/4}
    .tiny{padding:9px 11px;font-size:12px}
    #btnShoot{flex:1;min-width:60%}
    .queue,.gallery{max-height:none}

<body>
<header>
  <h1>CONTINUUM<span>.</span></h1>

<main>
  <section class="panel">

    <div class="stage">

  <section style="display:flex;flex-direction:column;gap:16px">

<script>
"use strict";
/* ==========================================================================
   CONTINUUM — webcam frame -> "the seconds immediately after" -> MiniMax H3 i2v
   Runs on: localhost (server.mjs, saves to ./captures) or Vercel (proxy + share)
   ========================================================================== */

const API_DIRECT = "https://api.venice.ai/api/v1";
const API_PROXY  = "/api/venice";
const LS_KEY = "continuum.settings.v2";
const POLL_MS = 5000;
const JOB_ACTIVE_TIMEOUT_MS = 12 * 60 * 1000;

const CAPS = {
  dirPicker: typeof window.showDirectoryPicker === "function",
  opfs: !!(navigator.storage && navigator.storage.getDirectory),
  share: !!(navigator.canShare && navigator.share),
  wakeLock: "wakeLock" in navigator,
  coarse: matchMedia("(pointer: coarse)").matches
};
const HOSTED = location.protocol.startsWith("http") &&
  !/^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname);

const state = {
  settings: {
    apiKey: "", directorModel: "qwen3-vl-235b-a22b",
    videoModel: "minimax-h3-image-to-video",
    duration: "8s", resolution: "768P", capWidth: 1280,
    mode: "serious",
    shuffle: false, mirror: true, saveStills: true, sendAR: false,
    useProxy: HOSTED, custom: ""
  },
  constraints: {}, queue: [], gallery: [], seq: 0, paused: false, running: false,
  dirHandle: null, usedNames: new Set(), serverSave: false, maxSaveBytes: 0,
  stream: null, facing: "user", autoTimer: null, countdown: 0, wakeLock: null
};
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function log(msg, cls) {
  const el = document.createElement("div");
  el.innerHTML = `<b>${new Date().toLocaleTimeString([], {hour12:false})}</b> ${msg}`;
  if (cls === "err") el.style.color = "var(--bad)";
  if (cls === "ok") el.style.color = "var(--good)";
  $("log").prepend(el);
  while ($("log").children.length > 250) $("log").lastChild.remove();
}

/* ------------------------------------------------------------ persistence - */
function saveSettings() { try { localStorage.setItem(LS_KEY, JSON.stringify(state.settings)); } catch {} }
function loadSettings() {
  try { Object.assign(state.settings, JSON.parse(localStorage.getItem(LS_KEY) || "{}")); } catch {}
  if (localStorage.getItem(LS_KEY) === null && HOSTED) state.settings.useProxy = true;
}

const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("continuum", 2);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains("kv")) r.result.createObjectStore("kv"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => {
    const t = db.transaction("kv", mode).objectStore("kv"); const q = fn(t);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); };
  return {
    get: (k) => tx("readonly", s => s.get(k)).catch(() => null),
    set: (k, v) => tx("readwrite", s => s.put(v, k)).catch(() => {}),
    del: (k) => tx("readwrite", s => s.delete(k)).catch(() => {})
  };
})();

async function persistQueue() {
  try { await idb.set("queue", state.queue.map(i => ({...i, videoUrl: undefined}))); } catch {}
}
async function restoreQueue() {
  const saved = await idb.get("queue");
  if (!Array.isArray(saved) || !saved.length) return;
  for (const i of saved) {
    if (i.status === "working") { i.status = "queued"; i.stage = "waiting"; i.progress = 0; }
    state.queue.push(i); state.seq = Math.max(state.seq, i.seq || 0);
  }
  log(`restored ${state.queue.length} unfinished shot(s) after reload`);
}

/* =============================== MODES ==================================== */
const BASE_DIRECTOR = `You are the DIRECTOR of a "continuum camera": an image-to-video system that animates the single photograph that was just taken, showing ONLY what happens in the seconds immediately after the shutter clicked.

The clip's FIRST FRAME must be the supplied photograph, identical in composition, subjects, clothing, pose, framing and lighting. Describe the CONTINUATION: motion, physics, expressions, micro-events, camera behaviour. Mention static content only as anchors ("the mug", "her left hand").

HARD RULES
- Continuity: at t=0 everything matches the photo. Change happens because of the events you describe.
- One continuous shot. No cuts. No new characters unless the mode calls for it.
- Present tense, concrete and physical: what moves, which direction, how far, how fast, what it collides with, what it sounds like.
- Always specify camera behaviour (locked-off tripod / slow push-in / handheld drift / slight tilt-down / rack focus / step closer).
- Fit the pacing to exactly {{duration}}: about {{beats}} distinct beats, the final beat landing in the last second.
- Never describe the whole scene from scratch — the model already has the pixels.
- Sound cues in [square brackets] are welcome (breath, clink, hum, gasp).
- "slug": 3-6 lowercase kebab-case ASCII words, no extension, <=48 chars, describing SCENE + EVENT, never the mode name.
- "edit_prompt": optional short image-edit instruction to push the still toward the coming moment; null if unnecessary.

Return ONLY a JSON object with exactly these keys:
{"scene": string, "slug": string, "caption": string, "motion_prompt": string, "negative_prompt": string, "edit_prompt": string|null}
"motion_prompt" is 1-3 dense sentences for the video model. "caption" is one plain human sentence.`;

const MODES = {
  boring: { label:"Boring", blurb:"Aggressively mundane. Nothing happens, very slowly.",
    brief:`BORING. The next few seconds are aggressively mundane. Almost nothing happens. Locked-off tripod, flat honest lighting, no styling. Only the smallest ambient motion: a blink, a breath, dust drifting in a light beam, a page edge lifting two millimetres, a fridge hum you can feel. No reveal, no punchline, no drama, no coincidence. The event, if there is one at all, is so minor it barely counts. Dull, comfortable, real.`,
    camera:"locked-off tripod, no zoom, no drift, boring and correct framing",
    negative:"dramatic lighting, fast motion, cuts, lens flares, excitement, cinematic grading" },
  luck: { label:"Luck", blurb:"Fortune intervenes. Perfect timing, small windfalls, nothing goes wrong.",
    brief:`LUCK. Fortune intervenes on behalf of the subject. A perfectly timed coincidence, a small windfall, the universe quietly aligning: a gust arriving at exactly the right moment, a coin landing the right way up, the thing falling into the hand already reaching. Warm golden timing, smooth satisfying physics, unearned grace. Nothing goes wrong. The last beat is the reward landing.`,
    camera:"smooth slow push-in that arrives exactly on the lucky beat",
    negative:"failure, accidents, clumsiness, dull lighting" },
  murphy: { label:"Murphy's Law", blurb:"Whatever can go wrong does, escalating to the worst outcome.",
    brief:`MURPHY'S LAW. Everything that can go wrong does, escalating. Start with a tiny wobble at the first beat — a tip, a slip, a grip loosening — and let the domino chain run to its logical conclusion within the clip. Exaggerated but believable comedic physics: things roll, tip, spill, snap, catch, tumble. Each beat is worse than the last. The final beat is the worst possible outcome, delivered deadpan, with the subject's face doing very little about it.`,
    camera:"slight handheld wobble, tilting to follow the disaster, pulling back as it completes",
    negative:"smooth success, calm, tidy, luck" },
  funny: { label:"Funny", blurb:"Set-up, absurd escalation, punchline on the last beat.",
    brief:`FUNNY. Comedy with timing. A clear set-up on the first beat, an absurd escalation in the middle, and a punchline that lands on the final beat. Physical comedy, deadpan reaction, one absurd intrusion treated completely seriously. The subject is the straight man and must NOT mug for the camera. The joke is in the timing and escalation, not wackiness for its own sake.`,
    camera:"deadpan static framing that holds through the absurdity, tiny hold on the punchline",
    negative:"overacting, cartoon exaggeration, slapstick chaos without timing" },
  serious: { label:"Serious", blurb:"Cinematic, grounded, restrained. A quiet dramatic beat.",
    brief:`SERIOUS. Cinematic, grounded, restrained. Deliberate motion, precise camera, naturalistic shifts in light and breath, emotional weight without whimsy. Every movement is considered. Slow micro-motion: a slow exhale, shoulders settling, eyes travelling, a hand closing. One quiet dramatic beat, landing without announcement.`,
    camera:"slow deliberate push-in with a shallow depth feel, or a very slow lateral drift",
    negative:"comedy, coincidence, chaos, bright saturation" },
  custom: { label:"Custom", blurb:"Your direction, verbatim and in charge.",
    brief:`CUSTOM. Follow the client direction below literally and completely. It outranks every stylistic default here. If it is short, expand it faithfully and physically; if it conflicts with the mode flavour, the client wins.`,
    camera:"whatever the direction implies, otherwise a slow push-in", negative:"" }
};
const BASE_NEGATIVE = "low resolution, error, worst quality, low quality, defects, morphing, warping faces, flicker, jump cuts, sudden scene change, text artifacts, watermark";

/* ============================ VENICE CLIENT =============================== */
const apiBase = () => state.settings.useProxy ? API_PROXY : API_DIRECT;
function apiHeaders() {
  const h = {"Content-Type": "application/json"};
  if (state.settings.apiKey) h.Authorization = "Bearer " + state.settings.apiKey.trim();
  return h;
}
const apiFetch = (path, {method="POST", body} = {}) =>
  fetch(apiBase() + path, {method, headers: apiHeaders(), body: body === undefined ? undefined : JSON.stringify(body)});

async function apiJson(path, opts) {
  const res = await apiFetch(path, opts);
  const text = await res.text();
  let data = null; try { data = JSON.parse(text); } catch {}
  if (!res.ok) {
    const msg = (data && (data.error || data.message)) || text.slice(0, 240) || res.statusText;
    throw Object.assign(new Error(`${res.status} ${msg}`), {status: res.status});
  }
  return data;
}
const RETRYABLE = new Set([408, 409, 425, 429, 500, 502, 503, 504]);
async function withRetry(fn, {tries=4, base=2500, label="call"} = {}) {
  let last;
  for (let i = 0; i < tries; i++) {
    try { return await fn(i); }
    catch (e) {
      last = e;
      if (!RETRYABLE.has(e.status) || i === tries - 1) throw e;
      const wait = base * Math.pow(2, i) + Math.random() * 800;
      log(`${label}: ${e.message} — retry in ${(wait/1000).toFixed(1)}s`, "err");
      await sleep(wait);
    }
  }
  throw last;
}

async function loadConstraints() {
  try {
    const data = await apiJson("/models?type=video", {method:"GET"});
    const list = data.data || data.models || [];
    const out = {}, models = [];
    for (const m of list) {
      const c = m.model_spec?.constraints || m.constraints || {};
      out[m.id] = { durations:c.durations||[], resolutions:c.resolutions||[], aspect_ratios:c.aspect_ratios||[],
                    audio_configurable:!!c.audio_configurable, prompt_limit:c.prompt_character_limit||2500 };
      models.push(m.id);
    }
    state.constraints = out;
    const sel = $("videoModel"); sel.innerHTML = "";
    for (const id of models.filter(i => /image-to-video/.test(i)).sort()) {
      const o = document.createElement("option"); o.value = id; o.textContent = id; sel.appendChild(o);
    }
    if (out[state.settings.videoModel]) sel.value = state.settings.videoModel;
    else state.settings.videoModel = sel.value || "minimax-h3-image-to-video";
    sel.onchange = () => { state.settings.videoModel = sel.value; saveSettings(); syncOptions(); };
    log(`model catalogue: ${models.length} video models`, "ok");
  } catch (e) { log("model constraints unavailable: " + e.message, "err"); }
  syncOptions();
}
function syncOptions() {
  const c = state.constraints[state.settings.videoModel] || {};
  const durs = c.durations?.length ? c.durations : ["5s","6s","7s","8s","9s","10s","11s","12s","13s","14s","15s"];
  const d = $("duration"); d.innerHTML = "";
  for (const x of durs) { const o = document.createElement("option"); o.value = x; o.textContent = x; d.appendChild(o); }
  d.value = durs.includes(state.settings.duration) ? state.settings.duration : durs[Math.min(3, durs.length-1)];
  state.settings.duration = d.value;
  d.onchange = () => { state.settings.duration = d.value; saveSettings(); };
  const ress = c.resolutions?.length ? c.resolutions : ["768P"];
  const r = $("resolution"); r.innerHTML = "";
  for (const x of ress) { const o = document.createElement("option"); o.value = x; o.textContent = x; r.appendChild(o); }
  r.value = ress.includes(state.settings.resolution) ? state.settings.resolution : ress[0];
  state.settings.resolution = r.value;
  r.onchange = () => { state.settings.resolution = r.value; saveSettings(); };
}

/* =============================== CAMERA =================================== */
async function enableCamera() {
  if (state.stream) state.stream.getTracks().forEach(t => t.stop());
  state.stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: {ideal: state.facing}, width: {ideal: 1080}, height: {ideal: 1920} }, audio: false
  });
  const cam = $("cam"); cam.srcObject = state.stream;
  cam.setAttribute("playsinline", ""); cam.muted = true;
  await cam.play().catch(() => {});
  $("stageMsg").style.display = "none"; $("shot").style.display = "none"; cam.style.display = "block";
  $("btnShoot").disabled = false; $("camBadge").textContent = "camera: live"; $("camBadge").classList.add("on");
  applyMirror();
}
function applyMirror() { $("cam").style.transform = `scaleX(${state.settings.mirror && state.facing === "user" ? -1 : 1})`; }

/* ============================== CAPTURE =================================== */
function grabFrame() {
  const cam = $("cam");
  const vw = cam.videoWidth || 1280, vh = cam.videoHeight || 720;
  const scale = Math.min(1, state.settings.capWidth / Math.max(vw, vh));
  const w = Math.max(2, Math.round(vw * scale / 2) * 2);
  const h = Math.max(2, Math.round(vh * scale / 2) * 2);
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  if (state.settings.mirror && state.facing === "user") { ctx.translate(w, 0); ctx.scale(-1, 1); }
  ctx.drawImage(cam, 0, 0, w, h);
  return { dataUrl: c.toDataURL("image/jpeg", 0.9), w, h };
}
async function shoot() {
  if (!state.stream) return;
  if (state.countdown > 0) {
    for (let i = state.countdown; i > 0; i--) {
      $("stageMsg").style.display = "flex"; $("stageMsg").textContent = String(i);
      await sleep(700);
    }
    $("stageMsg").style.display = "none";
  }
  const frame = grabFrame();
  const item = {
    id: crypto.randomUUID(), seq: ++state.seq, status: "queued", stage: "waiting",
    frame, frameUrl: frame.dataUrl, mode: pickMode(),
    duration: state.settings.duration,
    resolution: state.settings.resolution, model: state.settings.videoModel,
    custom: state.settings.custom,
    progress: 0, ts: Date.now(), slug: null, caption: null, prompt: null, error: null
  };
  state.queue.push(item); flash(frame.dataUrl); render(); persistQueue(); pump();
  log(`#${item.seq} captured ${frame.w}x${frame.h} — ${MODES[item.mode].label}`);
}
function flash(url) {
  const img = $("shot"); img.src = url; img.style.display = "block"; $("cam").style.display = "none";
  clearTimeout(flash._t);
  flash._t = setTimeout(() => { if (state.stream) { img.style.display = "none"; $("cam").style.display = "block"; } }, 1100);
}
function pickMode() {
  if (!state.settings.shuffle) return state.settings.mode;
  const ids = Object.keys(MODES).filter(m => m !== "custom"), pool = [];
  for (const id of ids) for (let i = 0; i < 12; i++) pool.push(id);
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ============================== DIRECTOR ================================== */
function buildDirectorPrompt(item) {
  const mode = MODES[item.mode] || MODES.serious;
  const secs = parseInt(item.duration, 10) || 8;
  const beats = Math.max(1, Math.round(secs / 2.5));
  const parts = [BASE_DIRECTOR.replaceAll("{{duration}}", secs + " seconds").replaceAll("{{beats}}", String(beats))];
  parts.push(`\n\nMODE BRIEF — ${mode.label.toUpperCase()}\n${mode.brief}`);
  parts.push(`\n\nCAMERA DEFAULT\n${mode.camera}`);
  if (mode.negative) parts.push(`\n\nAVOID\n${mode.negative}`);
  const dir = (item.custom || "").trim();
  if (item.mode === "custom" || dir)
    parts.push(`\n\nCLIENT DIRECTION (highest priority)\n${dir || mode.brief}`);
  parts.push(`\n\nDuration: ${secs} seconds. Now write the continuation JSON.`);
  return parts.join("");
}
function extractJson(t) {
  t = String(t || "").trim().replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  return JSON.parse(a >= 0 && b > a ? t.slice(a, b + 1) : t);
}
const sanitizeSlug = (s, fb) => (String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-")
  .replace(/^-+|-+$/g,"").split("-").filter(Boolean).slice(0,6).join("-").slice(0,48)) || fb;

async function direct(item) {
  const schema = { type:"json_schema", json_schema:{ name:"continuation", strict:true, schema:{
    type:"object",
    properties:{ scene:{type:"string"}, slug:{type:"string"}, caption:{type:"string"},
                 motion_prompt:{type:"string"}, negative_prompt:{type:"string"}, edit_prompt:{type:["string","null"]} },
    required:["scene","slug","caption","motion_prompt","negative_prompt","edit_prompt"], additionalProperties:false }}};
  const messages = [{ role:"user", content:[
    {type:"text", text: buildDirectorPrompt(item)},
    {type:"image_url", image_url:{ url: item.frameUrl }}
  ]}];
  const body = { model: state.settings.directorModel, messages, temperature: 0.85, max_tokens: 900 };
  let data;
  try { data = await withRetry(() => apiJson("/chat/completions", {body:{...body, response_format:schema}}), {label:"director"}); }
  catch (e) { if (!e.status || e.status === 400) data = await withRetry(() => apiJson("/chat/completions", {body}), {label:"director"}); else throw e; }
  const raw = data?.choices?.[0]?.message?.content ?? "";
  const json = extractJson(typeof raw === "string" ? raw : JSON.stringify(raw));
  const limit = state.constraints[item.model]?.prompt_limit || 2500;
  json.slug = sanitizeSlug(json.slug, `scene-${item.seq}`);
  json.motion_prompt = String(json.motion_prompt || "").slice(0, limit);
  json.negative_prompt = [BASE_NEGATIVE, json.negative_prompt].filter(Boolean).join(", ").slice(0, limit);
  return json;
}

/* ============================== PIPELINE ================================== */
function buildQueueBody(item, imageUrl, prompt, negative) {
  const c = state.constraints[item.model] || {};
  const body = {model:item.model, prompt, duration:item.duration, image_url:imageUrl};
  if (c.resolutions?.length) body.resolution = item.resolution;
  if (negative) body.negative_prompt = negative;
  if (state.settings.sendAR && c.aspect_ratios?.length) body.aspect_ratio = c.aspect_ratios.includes("16:9") ? "16:9" : c.aspect_ratios[0];
  if (c.audio_configurable) body.audio = true;
  return body;
}

async function processItem(item) {
  item.status = "working";
  try {
    item.stage = "directing"; item.progress = 6; render();
    const json = await direct(item);
    Object.assign(item, {slug:json.slug, caption:json.caption, scene:json.scene,
      prompt:json.motion_prompt, negative:json.negative_prompt});
    log(`#${item.seq} directed → <b>${esc(json.slug)}</b>`, "ok"); render();

    const startImage = item.frameUrl;

    item.stage = "queueing"; item.progress = 24; render();
    const q = await withRetry(() => apiJson("/video/queue", {body: buildQueueBody(item, startImage, json.motion_prompt, json.negative_prompt)}),
                              {label:`#${item.seq} queue`});
    item.queueId = q.queue_id; item.model = q.model || item.model; item.downloadUrl = q.download_url || null;
    log(`#${item.seq} queued on ${item.model} (${item.duration}, ${item.resolution})`);

    /* ---- poll: active-time only, so a locked phone doesn't burn the budget ---- */
    item.stage = "rendering"; item.progress = 30; render(); keepAwake(true);
    const t0 = Date.now(); let activeMs = 0, last = Date.now(), blob = null;
    while (!blob) {
      if (item.cancelled) throw new Error("cancelled");
      await sleep(POLL_MS);
      const now = Date.now();
      if (now - last < POLL_MS * 6) activeMs += now - last;
      last = now;
      if (activeMs > JOB_ACTIVE_TIMEOUT_MS) throw new Error("render timed out");

      let res = await apiFetch("/video/retrieve", {body:{model:item.model, queue_id:item.queueId}});
      if (res.status === 400 || res.status === 404) {
        const alt = await apiFetch(`/video/retrieve?queue_id=${encodeURIComponent(item.queueId)}&model=${encodeURIComponent(item.model)}`, {method:"GET"});
        if (alt.ok || alt.status !== 404) res = alt;
      }
      if (RETRYABLE.has(res.status)) { await sleep(4000); continue; }
      if (!res.ok) throw Object.assign(new Error(`retrieve ${res.status} ${(await res.text()).slice(0,140)}`), {status:res.status});

      const ct = res.headers.get("content-type") || "";
      if (ct.includes("video/") || ct.includes("octet-stream")) { blob = new Blob([await res.arrayBuffer()], {type:"video/mp4"}); break; }
      const j = await res.json().catch(() => ({}));
      if (j.status === "FAILED" || j.status === "ERROR") throw new Error("provider failed: " + (j.error || "unknown"));
      if (j.status === "COMPLETED") {
        const url = item.downloadUrl || j.download_url || j.video_url;
        if (url) { blob = new Blob([await (await fetch(url)).arrayBuffer()], {type:"video/mp4"}); break; }
      }
      const avg = j.average_execution_time || 0, done = j.execution_duration || 0;
      const eta = avg ? Math.max(0, Math.round((avg - done)/1000)) : 0;
      item.progress = Math.min(92, 30 + (t0 ? Math.min(62, Date.now() - t0) / (JOB_ACTIVE_TIMEOUT_MS / 62) : 0));
      item.stage = eta ? `rendering ~${eta}s left` : "rendering";
      render();
    }
    keepAwake(false);
    if (item.downloadUrl) fetch(item.downloadUrl, {method:"DELETE"}).catch(() => {});

    item.stage = "saving"; item.progress = 95; render();
    const name = await uniqueName(item.slug);
    const saved = await saveArtifacts(item, blob, name, startImage);
    item.file = saved.path; item.videoUrl = URL.createObjectURL(blob);
    item.status = "done"; item.stage = "saved"; item.progress = 100;
    state.gallery.unshift({ ts:Date.now(), slug:name, file:saved.path, caption:item.caption, mode:item.mode,
      prompt:item.prompt, duration:item.duration, model:item.model, videoUrl:item.videoUrl });
    log(`#${item.seq} saved → <b>${esc(saved.path)}</b> (${saved.via})`, "ok");
  } catch (e) {
    item.status = "error"; item.error = e?.message || String(e);
    keepAwake(false); log(`#${item.seq} failed: ${item.error}`, "err");
  }
  render(); persistQueue();
}

async function pump() {
  if (state.running) return;
  state.running = true;
  while (true) {
    if (state.paused) { await sleep(600); if (!state.queue.some(i => i.status === "queued")) break; continue; }
    const next = state.queue.find(i => i.status === "queued");
    if (!next) break;
    await processItem(next);
  }
  state.running = false; render();
}

/* ============================== SAVING ==================================== */
let wakeLock = null;
async function keepAwake(on) {
  if (!CAPS.wakeLock) return;
  try {
    if (on && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}
const dayFolder = () => new Date().toISOString().slice(0, 10);
async function uniqueName(slug) {
  const base = sanitizeSlug(slug, "continuum");
  let name = `${String(state.seq).padStart(3,"0")}-${base}`, n = 2;
  while (state.usedNames.has(name)) name = `${String(state.seq).padStart(3,"0")}-${base}-${n++}`;
  state.usedNames.add(name); return name;
}
const blobToB64 = (b) => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result.split(",")[1]); f.readAsDataURL(b); });
function dataUrlToBlob(u) {
  const [head, b64] = u.split(",");
  const mime = (head.match(/data:([^;]+)/) || [, "image/jpeg"])[1];
  const bin = atob(b64), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}
function downloadBlob(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function shareClip(blob, name, caption) {
  if (!CAPS.share) return false;
  const f = new File([blob], name + ".mp4", {type:"video/mp4"});
  if (!navigator.canShare({files:[f]})) return false;
  try { await navigator.share({files:[f], title:name, text:caption || ""}); return true; }
  catch (e) { return e.name === "AbortError"; }
}
async function opfsRoot() { return await navigator.storage.getDirectory(); }
async function opfsWrite(rel, blob) {
  const [day, file] = rel.split("/");
  const d = await (await opfsRoot()).getDirectoryHandle(day, {create:true});
  const fh = await d.getFileHandle(file, {create:true});
  const w = await fh.createWritable(); await w.write(blob); await w.close();
}
async function opfsAppend(rel, text) {
  const [day, file] = rel.split("/");
  const d = await (await opfsRoot()).getDirectoryHandle(day, {create:true});
  const fh = await d.getFileHandle(file, {create:true});
  const prev = (await fh.getFile()).size ? await (await fh.getFile()).text() : "";
  const w = await fh.createWritable(); await w.write(prev + text); await w.close();
}
async function opfsIndexPush(entry) {
  const root = await opfsRoot();
  const fh = await root.getFileHandle("index.json", {create:true});
  let arr = [];
  try { if ((await fh.getFile()).size) arr = JSON.parse(await (await fh.getFile()).text()); } catch {}
  arr.push(entry);
  const w = await fh.createWritable(); await w.write(JSON.stringify(arr.slice(-200))); await w.close();
}
async function hydrateOPFS() {
  if (!CAPS.opfs) return;
  try {
    const root = await opfsRoot();
    const fh = await root.getFileHandle("index.json").catch(() => null);
    if (!fh) return;
    const arr = JSON.parse(await (await fh.getFile()).text());
    for (const e of arr.slice(-24)) {
      const [day, file] = e.file.split("/");
      const d = await root.getDirectoryHandle(day).catch(() => null); if (!d) continue;
      const vh = await d.getFileHandle(file).catch(() => null); if (!vh) continue;
      const blob = await (await vh.getFile()).blob();
      state.usedNames.add(e.slug);
      state.gallery.push({...e, videoUrl: URL.createObjectURL(blob)});
    }
    state.gallery.sort((a,b) => b.ts - a.ts);
    log(`reloaded ${state.gallery.length} clip(s) from device storage`, "ok");
  } catch (e) { log("opfs hydrate: " + e.message, "err"); }
}
async function ensurePermission(h) {
  const o = {mode:"readwrite"};
  if (await h.queryPermission(o) === "granted") return true;
  return await h.requestPermission(o) === "granted";
}
async function saveArtifacts(item, blob, name, startImage) {
  const day = dayFolder(), rel = `${day}/${name}.mp4`;
  const manifest = JSON.stringify({
    ts:new Date().toISOString(), slug:name, file:`${name}.mp4`,
    source_frame: state.settings.saveStills ? `${name}.jpg` : null,
    mode:item.mode,
    model:item.model, duration:item.duration, resolution:item.resolution,
    queue_id:item.queueId || null, caption:item.caption, scene:item.scene, prompt:item.prompt
  }) + "\n";

  /* 1. desktop folder (Chrome/Edge) */
  if (state.dirHandle && CAPS.dirPicker && await ensurePermission(state.dirHandle)) {
    const dir = await state.dirHandle.getDirectoryHandle(day, {create:true});
    const fh = await dir.getFileHandle(`${name}.mp4`, {create:true});
    const w = await fh.createWritable(); await w.write(blob); await w.close();
    if (state.settings.saveStills) {
      const sh = await dir.getFileHandle(`${name}.jpg`, {create:true});
      const sw = await sh.createWritable(); await sw.write(dataUrlToBlob(startImage)); await sw.close();
    }
    const mh = await dir.getFileHandle("manifest.jsonl", {create:true});
    const prev = (await mh.getFile()).size ? await (await mh.getFile()).text() : "";
    const mw = await mh.createWritable(); await mw.write(prev + manifest); await mw.close();
    return {path:rel, via:"folder"};
  }

  /* 2. server disk (localhost) — small videos only on Vercel */
  if (state.serverSave && (!state.maxSaveBytes || blob.size <= state.maxSaveBytes)) {
    try {
      const r = await fetch("/api/save", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ path:rel, data: await blobToB64(blob),
          still: state.settings.saveStills ? startImage.split(",")[1] : null,
          stillPath: state.settings.saveStills ? `${day}/${name}.jpg` : null, manifest })});
      if (r.ok) return {path:rel, via:"server"};
    } catch {}
  }

  /* 3. device storage (OPFS) */
  if (CAPS.opfs) {
    try {
      await opfsWrite(rel, blob);
      if (state.settings.saveStills) await opfsWrite(`${day}/${name}.jpg`, dataUrlToBlob(startImage));
      await opfsAppend(`${day}/manifest.jsonl`, manifest);
      await opfsIndexPush({ts:Date.now(), slug:name, file:rel, caption:item.caption, mode:item.mode,
        prompt:item.prompt, duration:item.duration, model:item.model});
      item.opfs = true;
    } catch (e) { log("device storage: " + e.message, "err"); }
  }

  /* 4. share sheet -> Photos (the iOS path) */
  if (await shareClip(blob, name, item.caption)) return {path:`${name}.mp4 → Photos`, via:"share"};

  /* 5. download */
  downloadBlob(blob, `${name}.mp4`);
  return {path:`${name}.mp4 (Downloads)`, via:"download"};
}

/* ================================ RENDER ================================== */
function render() {
  const pending = state.queue.filter(i => i.status === "queued" || i.status === "working").length;
  $("queueDepth").textContent = "queue " + pending;
  $("qStat").textContent = pending + " pending";
  const q = $("queue");
  if (!state.queue.length) q.innerHTML = `<div class="hint">Nothing queued.</div>`;
  else {
    q.innerHTML = "";
    for (const i of state.queue) {
      const st = i.status === "working" ? "work" : i.status === "error" ? "err" : i.status === "done" ? "done" : "";
      const el = document.createElement("div"); el.className = "item";
      el.innerHTML = `
        <div class="top"><span class="seq">#${String(i.seq).padStart(3,"0")}</span>
          <span class="slug">${esc(i.slug || "…" + MODES[i.mode].label.toLowerCase())}</span>
          <span class="state ${st}">${esc(i.status === "working" ? i.stage : i.status)}</span></div>
        ${i.caption ? `<div class="meta">${esc(i.caption)}</div>` : ""}
        ${i.error ? `<div class="meta" style="color:var(--bad)">${esc(i.error)}</div>` : ""}
        <div class="bar"><i style="width:${Math.round(i.progress||0)}%"></i></div>
        <div class="row" style="margin-top:7px">
          ${i.status === "error" ? `<button class="tiny" data-act="retry" data-id="${i.id}">Retry</button>` : ""}
          ${i.prompt ? `<button class="tiny ghost" data-act="prompt" data-id="${i.id}">Prompt</button>` : ""}
          ${i.status !== "working" ? `<button class="tiny ghost" data-act="rerun" data-id="${i.id}">Re-run</button>
             <button class="tiny ghost" data-act="drop" data-id="${i.id}">Remove</button>` : ""}
        </div>`;
      q.appendChild(el);
    }
  }
  const g = $("gallery"); $("gStat").textContent = state.gallery.length;
  if (!state.gallery.length) g.innerHTML = `<div class="hint">Finished clips land here.</div>`;
  else {
    g.innerHTML = "";
    for (const c of state.gallery.slice(0, 40)) {
      const el = document.createElement("div"); el.className = "card";
      el.innerHTML = `
        <video src="${c.videoUrl}" controls muted loop playsinline preload="metadata"></video>
        <div class="cap"><b>${esc(c.slug)}</b><p>${esc(c.caption || "")}</p>
          <div class="row" style="margin-top:6px">
            <span class="pill">${esc(MODES[c.mode]?.label || c.mode)} · ${esc(c.duration || "")}</span>
            <button class="tiny ghost" data-act="share" data-file="${esc(c.file)}">${CAPS.share ? "Save to Photos" : "Save"}</button>
          </div></div>`;
      g.appendChild(el);
    }
  }
  $("modeBadge").textContent = "mode: " + MODES[state.settings.mode].label;
  $("btnPause").textContent = state.paused ? "Resume queue" : "Pause queue";
}

/* ================================ UI ====================================== */
function buildModeTiles() {
  const wrap = $("modes");
  for (const [id, m] of Object.entries(MODES)) {
    const b = document.createElement("button");
    b.className = "mode" + (id === state.settings.mode ? " sel" : ""); b.dataset.mode = id;
    b.innerHTML = `<b>${m.label}</b><i>${m.blurb}</i>`;

}
function setSaveHint() {

  if (state.serverSave) parts.push(state.maxSaveBytes ? "<b>server blob</b> (small clips)" : "<b>server disk</b> (./captures)");
  if (CAPS.opfs) parts.push("<b>device storage</b>");

  $("saveHint").innerHTML = "Save ladder: " + parts.join(" → ") + ". First available wins.";
  $("folderBadge").textContent = state.dirHandle ? "folder: " + state.dirHandle.name
    : state.serverSave ? (state.maxSaveBytes ? "save: blob" : "save: server") : CAPS.opfs ? "save: device" : "save: share";
  if (!CAPS.dirPicker) {
    $("btnFolder").textContent = "Folder (desktop only)";

  }
}
function bindUI() {
  $("btnCam").onclick = () => enableCamera().catch(e => log("camera: " + e.message, "err"));
  $("btnShoot").onclick = () => shoot();
  $("btnFlip").onclick = () => { state.facing = state.facing === "user" ? "environment" : "user";
    enableCamera().catch(e => log("flip: " + e.message, "err")); };
  $("btnCountdown").onclick = (e) => { state.countdown = state.countdown ? 0 : 3;
    e.target.style.borderColor = state.countdown ? "var(--accent)" : ""; };
  $("btnAuto").onclick = (e) => {
    if (state.autoTimer) { clearInterval(state.autoTimer); state.autoTimer = null; e.target.style.borderColor = ""; }
    else { state.autoTimer = setInterval(shoot, 20000); e.target.style.borderColor = "var(--accent)"; } };
  const bindCheck = (id, key, after) => { $(id).checked = state.settings[key];
    $(id).onchange = (e) => { state.settings[key] = e.target.checked; saveSettings(); after?.(); }; };
  bindCheck("shuffle", "shuffle"); bindCheck("saveStills", "saveStills");
  bindCheck("sendAR", "sendAR");
  bindCheck("useProxy", "useProxy", () => loadConstraints());
  $("custom").value = state.settings.custom;
  $("custom").oninput = (e) => { state.settings.custom = e.target.value; saveSettings(); };
  $("apiKey").value = state.settings.apiKey;
  $("apiKey").oninput = (e) => { state.settings.apiKey = e.target.value; saveSettings(); };
  $("directorModel").value = state.settings.directorModel;
  $("directorModel").oninput = (e) => { state.settings.directorModel = e.target.value; saveSettings(); };
  $("capWidth").value = String(state.settings.capWidth);
  $("capWidth").onchange = (e) => { state.settings.capWidth = +e.target.value; saveSettings(); };
  $("btnFolder").onclick = async () => {
    if (!CAPS.dirPicker) return log("no folder picker here — using " + (state.serverSave ? "server" : CAPS.opfs ? "device storage" : "share sheet"), "err");
    try { const h = await window.showDirectoryPicker({id:"continuum", mode:"readwrite", startIn:"pictures"});
      state.dirHandle = h; await idb.set("dirHandle", h); setSaveHint(); log("folder: " + h.name, "ok"); }
    catch (e) { if (e.name !== "AbortError") log("folder: " + e.message, "err"); } };
  $("btnForget").onclick = async () => { state.dirHandle = null; await idb.del("dirHandle"); setSaveHint(); };
  $("btnReloadModels").onclick = () => loadConstraints();
  $("btnPause").onclick = () => { state.paused = !state.paused; render(); if (!state.paused) pump(); };
  $("btnClearDone").onclick = () => { state.queue = state.queue.filter(i => i.status !== "done"); render(); persistQueue(); };
  $("btnClearAll").onclick = () => { state.queue = []; state.seq = 0; render(); persistQueue(); };

  $("queue").onclick = (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const item = state.queue.find(i => i.id === b.dataset.id); if (!item) return;
    const act = b.dataset.act;
    if (act === "retry") { item.status = "queued"; item.error = null; item.progress = 0; render(); pump(); }
    if (act === "drop") { item.cancelled = true; state.queue = state.queue.filter(i => i.id !== item.id); render(); persistQueue(); }
    if (act === "prompt") {
      const w = window.open("", "_blank");
      w.document.write(`<pre style="font:13px/1.6 ui-monospace;padding:20px;white-space:pre-wrap">${esc(
        `SLUG: ${item.slug}\nMODE: ${MODES[item.mode].label}\nMODEL: ${item.model} ${item.duration} ${item.resolution}\n\nCAPTION: ${item.caption}\n\nMOTION PROMPT:\n${item.prompt}\n\nNEGATIVE:\n${item.negative || ""}\n\nQUEUE ID: ${item.queueId || "-"}`)}</pre>`);
    }
    if (act === "rerun") {
      const m = prompt("Re-run #" + item.seq + " as: boring / luck / murphy / funny / serious / custom", item.mode);
      if (!m || !MODES[m]) return;
      state.queue.push({...item, id:crypto.randomUUID(), seq:++state.seq, status:"queued", stage:"waiting",
        mode:m, progress:0, error:null, slug:null, caption:null, prompt:null, videoUrl:null,
        queueId:null, cancelled:false, ts:Date.now()});
      render(); persistQueue(); pump();
    }
  };
  $("gallery").onclick = async (e) => {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const c = state.gallery.find(x => x.file === b.dataset.file); if (!c) return;
    const blob = await (await fetch(c.videoUrl)).blob();
    const name = c.file.split("/").pop().replace(/\.mp4$/, "");
    if (await shareClip(blob, name, c.caption)) return;
    if (state.dirHandle && await ensurePermission(state.dirHandle)) {
      const dir = await state.dirHandle.getDirectoryHandle(dayFolder(), {create:true});
      const fh = await dir.getFileHandle(name + ".mp4", {create:true});
      const w = await fh.createWritable(); await w.write(blob); await w.close(); return;
    }
    downloadBlob(blob, name + ".mp4");
  };
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); shoot(); }
  });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      if (state.queue.some(i => i.status === "working")) keepAwake(true);
      if (state.stream && $("cam").paused) $("cam").play().catch(() => {});
    }
    persistQueue();
  });
  addEventListener("pagehide", persistQueue);
}

/* =============================== BOOT ===================================== */
(async function boot() {
  loadSettings(); buildModeTiles(); bindUI(); render();

  try { state.dirHandle = await idb.get("dirHandle"); } catch {}
  try {
    const r = await fetch("/api/health", {cache:"no-store"});
    if (r.ok) { const j = await r.json(); state.serverSave = !!j.save; state.maxSaveBytes = j.maxSaveBytes || 0;
      if (j.proxy) state.settings.useProxy = true; }
  } catch {}
  setSaveHint();
  if (CAPS.opfs) navigator.storage.persist?.().catch(() => {});

  $("banner").innerHTML = HOSTED
    ? `Hosted mode. Clips go to <b>${CAPS.share ? "Photos via the share sheet" : "your device"}</b>${CAPS.opfs ? " and are kept in device storage" : ""}. Desktop browsers can also pick a real folder.`
    : "";

  await restoreQueue();
  await hydrateOPFS();
  if (state.dirHandle) {
    $("folderBadge").textContent = "folder: " + state.dirHandle.name + " (tap)";
    $("folderBadge").onclick = async () => { try { await ensurePermission(state.dirHandle); } catch {} };
  }
  if (state.settings.apiKey || state.serverSave || HOSTED) loadConstraints();
  log("CONTINUUM ready — strict first-come, first-served queue.");
  if (!state.settings.apiKey && !state.serverSave && !HOSTED) log("no API key yet — add one in Settings", "err");
  pump();
})();
</script>
</body>
</html>
